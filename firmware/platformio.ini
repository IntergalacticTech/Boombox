; Boombox wireless remote firmware — PlatformIO config.
;
; Phase 2 ships one environment: `cyd-2432s028r` (the CYD 2.8" 240x320
; resistive-touch board). Future profiles (ELECROW round, headless DIY,
; M5StickC, etc.) add their own [env:] blocks and reuse the shared
; lib/boombox-remote-core library.

[platformio]
default_envs = cyd-2432s028r
src_dir = src
lib_dir = lib

[env]
platform = espressif32@^6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lvgl/lvgl@^9
    bblanchon/ArduinoJson@^7
    gilmaimon/ArduinoWebsockets@^0.5
    bodmer/TFT_eSPI@^2.5
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bodmer/TJpg_Decoder@^1.1
build_flags =
    -D BOOMBOX_FW_VERSION=\"0.1.0\"
    -D LV_CONF_INCLUDE_SIMPLE=1

; ----- cyd-2432s028r — CYD 2.8" 240x320 resistive touch ----------------
; Display: ILI9341 (some batches ship ST7789; flip the driver flag below
;   if the screen stays blank).
; Touch: XPT2046 resistive.
; Backlight: GPIO 21 (PWM).
; LDR (light sensor): GPIO 34 (analog).
; RGB LED (CYD-specific, active-low): GPIO 4 (R), 16 (G), 17 (B).
[env:cyd-2432s028r]
board = esp32dev
board_build.partitions = huge_app.csv
build_src_filter = +<devices/cyd-2432s028r/>
build_flags = ${env.build_flags}
    -D PROFILE_ID=\"cyd-2432s028r\"
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
