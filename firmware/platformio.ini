; Boombox wireless remote firmware — PlatformIO config.
;
; Phase 2 ships one environment: `cyd-2432s028r` (the CYD 2.8" 240x320
; resistive-touch board). Future profiles (ELECROW round, headless DIY,
; M5StickC, etc.) add their own [env:] blocks and reuse the shared
; lib/boombox-remote-core library.

[platformio]
default_envs = cyd-2432s028r
src_dir = src
lib_dir = lib

[env]
platform = espressif32@^6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lvgl/lvgl@^9
    bblanchon/ArduinoJson@^7
    gilmaimon/ArduinoWebsockets@^0.5
    bodmer/TFT_eSPI@^2.5
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bodmer/TJpg_Decoder@^1.1
    h2zero/NimBLE-Arduino@^2
build_flags =
    -D BOOMBOX_FW_VERSION=\"0.1.0\"
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I src
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17

; ----- cyd-2432s028r — CYD 2.8" 240x320 resistive touch ----------------
; Display: ILI9341 (some batches ship ST7789; flip the driver flag below
;   if the screen stays blank).
; Touch: XPT2046 resistive.
; Backlight: GPIO 21 (PWM).
; LDR (light sensor): GPIO 34 (analog).
; RGB LED (CYD-specific, active-low): GPIO 4 (R), 16 (G), 17 (B).
[env:cyd-2432s028r]
board = esp32dev
board_build.partitions = huge_app.csv
build_src_filter = +<devices/cyd-2432s028r/>
build_flags = ${env.build_flags}
    -D PROFILE_ID=\"cyd-2432s028r\"
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D USE_HSPI_PORT=1

; ----- crowpanel-rotary-21 — Elecrow CrowPanel 2.1" 480x480 round knob ---
; ESP32-S3R8 (16 MB QIO flash, 8 MB octal PSRAM), ST7701S RGB panel with a
; 3-wire SPI init bus, CST8xx capacitive touch @0x15, quadrature encoder on
; GPIO 42/4 with its push switch on a PCF8574 (@0x21, P5). LCD power/reset
; and touch reset also hang off the PCF8574. Pins + panel timings are taken
; from Elecrow's own example (RotaryScreen_2_1.ino) — see
; src/devices/crowpanel-rotary-21/board/Board.h.
;
; The stock espressif32 platform stops at Arduino core 2.0.x; Arduino_GFX
; 1.6.7 (the version Elecrow ships and validates against) needs core 3.x,
; so this env uses the pioarduino platform. Build on the Mac, flash through
; the Pi with ./pi-flash-knob (the board sits on MarkII's USB).
[env:crowpanel-rotary-21]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_src_filter = +<devices/crowpanel-rotary-21/>
lib_deps =
    lvgl/lvgl@~9.2.2
    bblanchon/ArduinoJson@^7
    h2zero/NimBLE-Arduino@^2
    moononournation/GFX Library for Arduino@1.6.7
    adafruit/Adafruit CST8XX Library@^1.1.1
    adafruit/Adafruit BusIO@^1.16.1
    gilmaimon/ArduinoWebsockets@^0.5
; The profile's own lv_conf.h (bigger fonts, snapshot, libc malloc so large
; buffers land in PSRAM) must win over src/lv_conf.h, so its include path
; goes first.
build_flags =
    -I src/devices/crowpanel-rotary-21/conf
    ${env.build_flags}
    -D PROFILE_ID=\"crowpanel-rotary-21\"
    -D BOOMBOX_BLE_NAME=\"boombox-knob\"
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ----- native — host unit tests for hardware-free logic -----------------
; `pio test -e native` runs test/test_knob_logic against lib/knob-logic
; (CSS colour parser + knob gesture state machine). Not a default env.
[env:native]
platform = native
framework =
test_framework = unity
lib_deps =
build_flags = -std=gnu++17 -Wall -Wextra -I lib/knob-logic/src
build_src_filter = -<*>
lib_compat_mode = off
lib_ignore = boombox-remote-core
