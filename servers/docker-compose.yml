# Boombox home media servers — Navidrome (music, Subsonic API) + Jellyfin (video).
#
# This stack runs the two servers the boombox streams from. It is meant to
# live on a "home server" (any Docker host: a NAS, a spare mini-PC, a Pi, or a
# cloud VPS) so both servers move OFF the boombox device and can be reached
# from outside the house.
#
#   1. cp .env.example .env   &&   edit .env  (paths, ports, timezone, creds)
#   2. docker compose up -d
#   3. First-run admin setup:  Navidrome http://<host>:4533  ·  Jellyfin http://<host>:8096
#
# Exposing this to the internet is a SEPARATE, deliberate step — see
# docs/HOME-SERVERS.md. Do NOT port-forward these raw HTTP ports; put TLS +
# auth in front (Cloudflare Tunnel overlay, or a reverse proxy).
#
# Optional Cloudflare Tunnel sidecar lives in docker-compose.cloudflared.yml;
# add it with:  docker compose -f docker-compose.yml -f docker-compose.cloudflared.yml up -d

services:
  # ── Music: Navidrome (Subsonic-API server the boombox Home Library syncs) ──
  navidrome:
    image: navidrome/navidrome:0.54.5   # pin a version; bump deliberately
    container_name: boombox-navidrome
    restart: unless-stopped
    # Run as your media-owning user so the DB and any writes have sane perms.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: "info"
      ND_SESSIONTIMEOUT: "24h"
      # Store transcode/cache under the data volume, not the image layer.
      ND_DATAFOLDER: "/data"
      ND_MUSICFOLDER: "/music"
      # Keep the reverse proxy / tunnel in charge of who reaches this. These
      # do NOT replace TLS + a strong password — see the Security section of
      # docs/HOME-SERVERS.md.
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - navidrome-data:/data
      - "${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro"
    healthcheck:
      # Official Navidrome healthcheck (image ships busybox wget).
      test: ["CMD", "wget", "-qO", "-", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Resource-friendly ceilings so a shared host stays responsive. Raise for
    # very large libraries (the first scan is the heaviest moment).
    mem_limit: "${NAVIDROME_MEM_LIMIT:-512m}"

  # ── Video: Jellyfin (the boombox proxies transport to it; apps play direct) ─
  jellyfin:
    image: jellyfin/jellyfin:10.10.7   # pin a version; bump deliberately
    container_name: boombox-jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
      # 8920 (HTTPS) is intentionally NOT published — terminate TLS at the
      # reverse proxy / tunnel instead. 1900/udp + 7359/udp (DLNA/discovery)
      # are LAN-only and off by default here; uncomment if you want them.
      # - "7359:7359/udp"
      # - "1900:1900/udp"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      # Tell Jellyfin its public origin so generated links are correct when
      # reached through a tunnel / reverse proxy. Leave blank for LAN-only.
      JELLYFIN_PublishedServerUrl: "${JELLYFIN_PUBLISHED_URL:-}"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - "${VIDEO_DIR:?set VIDEO_DIR in .env}:/media:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Software transcoding is CPU-hungry. On a small host, encode your library
    # to H.264/AAC so clients direct-play and this stays near idle.
    mem_limit: "${JELLYFIN_MEM_LIMIT:-2g}"
    # For hardware transcoding (Intel QSV / VAAPI) uncomment and see
    # docs/HOME-SERVERS.md:
    # devices:
    #   - /dev/dri:/dev/dri

volumes:
  # Named volumes keep server state (DB, playlists, watch history, metadata)
  # independent of the media itself — back THESE up. See docs/HOME-SERVERS.md.
  navidrome-data:
  jellyfin-config:
  jellyfin-cache:
