root /var/www/boombox;
index index.html;

# SPA: every unmatched path returns index.html so client routing works.
location / {
    try_files $uri $uri/ /index.html;
    # No HTML caching — UI updates land instantly after a deploy.
    add_header Cache-Control "no-cache" always;
}

# Hashed Vite assets get an aggressive cache.
location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Mopidy HTTP + WebSocket (Iris + JSON-RPC).
location /mopidy/ {
    proxy_pass http://127.0.0.1:6680/mopidy/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# boombox-state aggregator (MPRIS + /api/* helpers).
location /api/ {
    proxy_pass http://127.0.0.1:6681/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}

# boombox-buttons settings API (config, learn, test).
location /api/buttons/ {
    proxy_pass http://127.0.0.1:6683/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
}

# boombox-audio visualizer WebSocket.
location /audio/ {
    proxy_pass http://127.0.0.1:6682/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# boombox-uploader (LAN remote + file drop) — only responds when the unit is on.
# 1 GB upload cap matches MAX_FILE_BYTES in boombox-uploader.py.
#
# The uploader has its own 4-digit PIN gate (shown on the touchscreen), so we
# explicitly turn off the LAN Basic auth here. Otherwise guests would face a
# nginx auth modal before they could even type the PIN — and the touchscreen
# never displays the Basic-auth password to them.
location /upload/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:6683/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 1100M;
    proxy_request_buffering off;     # stream the upload, don't buffer to /tmp
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
