root /opt/boombox/current/ui/dist;
index index.html;

# SPA: every unmatched path returns index.html so client routing works.
location / {
    try_files $uri $uri/ /index.html;
    # No HTML caching — UI updates land instantly after a deploy.
    add_header Cache-Control "no-cache" always;
}

# Hashed Vite assets get an aggressive cache.
location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Mopidy HTTP + WebSocket (Iris + JSON-RPC).
location /mopidy/ {
    proxy_pass http://127.0.0.1:6680/mopidy/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# boombox-state aggregator (MPRIS + /api/* helpers).
location /api/ {
    proxy_pass http://127.0.0.1:6681/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}

# boombox-buttons settings API (config, learn, test).
location /api/buttons/ {
    proxy_pass http://127.0.0.1:6684/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
}

# boombox-updater HTTP API (status, config, install, rollback, log).
location /api/update/ {
    proxy_pass http://127.0.0.1:6686/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 5m;
    # SSE streams the install log on POST /api/update/install.
    proxy_buffering off;
}

# boombox-library HTTP API (catalog browse/search, pin, sync, resolver).
location /api/library/ {
    proxy_pass http://127.0.0.1:6687/api/library/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}

# boombox-rfid HTTP API (bindings CRUD + last-unbound-tap polling).
location /api/rfid/ {
    proxy_pass http://127.0.0.1:6688/api/rfid/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
}

# Phone-remote PWA — static SPA served from the release tree, like the
# kiosk SPA at /. auth_basic off so phones go straight to PIN pairing
# (the API it calls, /api/remote/, is bearer-token gated). `^~` is
# load-bearing: without it the file-extension regex at line 12 hijacks
# /remote/assets/*.js and 404s the whole PWA. no-cache keeps the PWA's
# autoUpdate path working — phones must refetch index.html + sw.js to
# detect a new deploy.
# Redirect /remote (no trailing slash) → /remote/. Without this the request
# falls through to `location /`, which requires basic auth on the LAN block
# and pops the browser auth modal before the user ever sees the PWA.
location = /remote {
    auth_basic off;
    return 301 /remote/;
}

location ^~ /remote/ {
    auth_basic off;
    alias /opt/boombox/current/remote-ui/dist/;
    # Fallback MUST be the URI form (/remote/index.html), not an absolute
    # filesystem path. nginx interprets a /-prefixed last arg of try_files
    # as an internal-redirect URI; an /opt/... path falls through to
    # `location /`, which on the LAN block (port 8090) is basic-auth-gated.
    # That's why /remote/favicon.svg (and any other PWA asset that isn't
    # on disk) was popping the LAN auth modal mid-PWA.
    try_files $uri $uri/ /remote/index.html;
    add_header Cache-Control "no-cache" always;
}

# boombox-remote phone remote (state, command, WebSocket, album art).
#
# The remote service authenticates with its own bearer tokens (paired via QR),
# so we explicitly disable LAN Basic auth here — the phone never sees the
# Basic-auth modal and goes straight to the token handshake.
location /api/remote/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:6685/api/remote/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # matches remote_files.MAX_FILE_BYTES — the 4 GB in-handler per-file cap
    client_max_body_size 4096M;
    proxy_request_buffering off;     # stream uploads, don't buffer to /tmp
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# Mopidy's /local/ asset endpoint serves embedded album art via
# core.library.get_images. The PWA loads these as <img src="/local/...">
# alongside the iTunes fallback. No auth — they're already gated by the
# /api/remote/ token flow on the upstream state read.
location /local/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:6680/local/;
    proxy_set_header Host $host;
    expires 1d;
    add_header Cache-Control "public, immutable";
}

# boombox-audio visualizer WebSocket.
location /audio/ {
    proxy_pass http://127.0.0.1:6682/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
