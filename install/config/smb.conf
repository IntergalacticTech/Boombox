# /etc/samba/smb.conf  (installed by install.sh)
#
# Password-protected LAN share for the music library. The installer sets the
# Samba password to the generated Boombox remote password/PIN.

[global]
   workgroup = WORKGROUP
   server string = Boombox
   server role = standalone server
   security = user
   map to guest = Bad User
   usershare allow guests = no
   server min protocol = SMB2
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[boombox-music]
   comment = Boombox music library
   path = __MUSIC_DIR__
   browseable = yes
   read only = no
   valid users = __BOOMBOX_USER__
   force user = __BOOMBOX_USER__
   create mask = 0644
   directory mask = 0755
