# /etc/pipewire/pipewire-pulse.conf.d/10-boombox-mopidy-tcp.conf
#
# Mopidy runs as the `mopidy` system user and cannot reach the boombox
# user's PipeWire socket under /run/user/<uid>, and PipeWire (not Mopidy)
# owns the DAC — so Mopidy streams into pipewire-pulse over LOOPBACK TCP
# ("pulsesink server=127.0.0.1:4713" in mopidy.conf). Loopback only: never
# bind a LAN address, PulseAudio TCP has no authentication here.
pulse.properties = {
    server.address = [
        "unix:native"
        { address = "tcp:127.0.0.1:4713" client.access = "unrestricted" }
    ]
}
