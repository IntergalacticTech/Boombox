# /etc/systemd/logind.conf.d/boombox.conf — installed by install.sh.
#
# The front-panel power button is wired to BOTH GPIO 27 (read by
# boombox-buttons: short press = sleep/wake, hold = shutdown) AND the Pi 5's
# J2 PWR_BTN header (the only thing that can wake a halted Pi 5 after the
# standby auto-poweroff). While the Pi is running, the PMIC reports a J2
# press as a power key and logind would poweroff on it immediately — which
# would turn every "sleep" tap into a hard shutdown. Hand the key back to
# boombox-buttons by ignoring it here. See hardware/README.md.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
