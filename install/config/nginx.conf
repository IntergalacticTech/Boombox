# /etc/nginx/sites-available/boombox  (installed by install.sh)
#
# Local kiosk:
#   http://localhost/        → no auth, loopback only
#
# LAN access:
#   http://<pi>:__REMOTE_WEB_PORT__/ → HTTP Basic auth, then the same app
#
# The common routes live in /etc/nginx/snippets/boombox-common.conf so the
# localhost and LAN server blocks stay identical except for listener/auth.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:80 default_server;
    listen [::1]:80 default_server;
    server_name localhost;

    include /etc/nginx/snippets/boombox-common.conf;
}

server {
    listen __REMOTE_WEB_PORT__ default_server;
    listen [::]:__REMOTE_WEB_PORT__ default_server;
    server_name _;

    auth_basic "Boombox";
    auth_basic_user_file /etc/nginx/boombox.htpasswd;

    include /etc/nginx/snippets/boombox-common.conf;
}
