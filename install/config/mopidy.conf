# /etc/mopidy/mopidy.conf  (installed by install.sh; edited as the mopidy user)
#
# Audio path: alsasink → /etc/asound.conf default → HiFiBerry DAC.
# Mixer is software so the SPA's /api/volume can drive volume uniformly
# across sources.

[core]
cache_dir = /var/cache/mopidy
data_dir  = /var/lib/mopidy
config_dir = /etc/mopidy

[audio]
output = alsasink
mixer  = software

[http]
hostname = 127.0.0.1
port     = 6680
# nginx terminates anything user-facing.
allowed_origins = localhost http://localhost

[local]
media_dir    = __MUSIC_DIR__
scan_timeout = 1000

[mpd]
hostname = 127.0.0.1
port     = 6600

[iris]
enabled = true
country = US

# Optional: drop in /etc/mopidy/extensions.d/*.conf for service-specific
# config (spotify creds, etc.). install.sh leaves [spotify] disabled by
# default; configure it after install if you want Spotify Connect via Mopidy
# instead of raspotify.
