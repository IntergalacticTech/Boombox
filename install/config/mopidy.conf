# /etc/mopidy/mopidy.conf  (installed by install.sh; edited as the mopidy user)
#
# Audio path: alsasink → /etc/asound.conf default → HiFiBerry DAC.
# Mixer is software so the SPA's /api/volume can drive volume uniformly
# across sources.

[core]
cache_dir = /var/cache/mopidy
data_dir  = /var/lib/mopidy
config_dir = /etc/mopidy

[audio]
output = alsasink
mixer  = software

[http]
hostname = 127.0.0.1
port     = 6680
# nginx terminates anything user-facing.
allowed_origins = localhost http://localhost

[local]
# Points at the symlink managed by cache_drive.update_symlink — the active
# cache drive (USB → SMB → empty) is swapped behind this path so Mopidy-Local
# never needs to be reconfigured at runtime.
media_dir    = /opt/boombox/cache-mount/audio
scan_timeout = 1000

[mpd]
hostname = 127.0.0.1
port     = 6600

[iris]
enabled = true
country = US

# Optional: drop in /etc/mopidy/extensions.d/*.conf for service-specific
# config (spotify creds, etc.). install.sh leaves [spotify] disabled by
# default; configure it after install if you want Spotify Connect via Mopidy
# instead of raspotify.

# Home Library (Navidrome / any Subsonic server) needs NO section here.
# Mopidy-Subsonic is not installed (Python-2 bit-rot); uncached tracks play
# through Mopidy's built-in stream backend from boombox-library's local
# proxy, http://127.0.0.1:6687/api/library/stream/<id>, which adds the
# Subsonic auth server-side — so no credential lives in this file or in the
# tracklist. boombox-library strips any leftover [subsonic] section (with
# its plaintext password) the next time the source is saved.
#
# [stream] is deliberately left at Mopidy's defaults (enabled, http/https,
# timeout 5000 ms, empty metadata_blacklist). Mopidy scans each http URI at
# tracklist.add time; that scan is what gives proxied tracks their
# title/artist/duration, at ~0.2-0.4 s per track through the proxy.
# Blacklisting the proxy URLs would make queueing instant, but every track
# would then show as a bare URL — so the scan stays. Raising the timeout
# would only make a dead upstream take longer to fail, per track.
